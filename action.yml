name: "Living Architecture Nodes Check"
description: "Check repository architecture memory, missing/stale nodes, and export local AI/dev diagnostic reports."
author: "Valentyn Rukhaylo / Altru.dev"

branding:
  icon: "activity"
  color: "orange"

inputs:
  workspace:
    description: "Repository-relative workspace path. Defaults to GITHUB_WORKSPACE. Must remain inside GITHUB_WORKSPACE."
    required: false
    default: ""
  mode:
    description: "check or export. Both run validation and write local diagnostic reports."
    required: false
    default: "check"
  fail_on:
    description: "Failure threshold: never, missing-required, missing-nodes, dirty-nodes, warnings."
    required: false
    default: "missing-required"
  changed_only:
    description: "When true, dirty-node detection focuses on changed files in the pull request or commit range."
    required: false
    default: "true"
  source_extensions:
    description: "Comma-separated source extensions to scan."
    required: false
    default: ".js,.jsx,.ts,.tsx,.mjs,.cjs,.py,.cs,.java,.go,.rs,.php,.rb,.swift,.kt,.kts,.vue,.svelte,.html,.css,.yml,.yaml"
  exclude_dirs:
    description: "Comma-separated folder names to exclude."
    required: false
    default: ".git,node_modules,dist,build,out,coverage,.next,.nuxt,.turbo,.cache,vendor,.venv,venv,__pycache__,.lan-action"
  export_path:
    description: "Workspace-relative output directory for local diagnostic exports."
    required: false
    default: ".lan-action"
  write_summary:
    description: "Write a GitHub step summary when possible."
    required: false
    default: "true"

outputs:
  health_score:
    description: "Heuristic architecture-memory maintenance score from 0 to 100; not a semantic architecture verdict."
  status:
    description: "healthy, warning, or failed for the configured basic CI policy."
  verification_scope:
    description: "Verification scope executed by this Action release."
  semantic_architecture_status:
    description: "Semantic architecture verification status. v0.1.1 reports NOT_VERIFIED."
  missing_required_count:
    description: "Number of missing required root artifacts."
  missing_node_count:
    description: "Number of source files without matching .node.md files."
  dirty_node_count:
    description: "Number of changed source files whose matching .node.md file was not changed."
  diagnostic_json:
    description: "Path to local diagnostic JSON export."
  diagnostic_markdown:
    description: "Path to local diagnostic Markdown export."

runs:
  using: "node24"
  main: "src/index.js"
